# ensure tmux uses the same PATH as the shell
set-environment -g PATH "$PATH"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# turn on vi mode 
set-window-option -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# set custom hotkeys for window navigation
bind a previous-window
bind d next-window

# open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# open new panes in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# swap windows
bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to yank (copy) selection as in Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Setup 'v' blockwise toggle (like Ctrl-v in Vim)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set-option -g status-left-length 100

# sessionizer
bind space run "tmux neww ~/scripts/shared/tms"
bind ` run "~/scripts/shared/tms ~"
bind f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse | xargs tmux switch-client -t"

# set theme
source-file ~/.config/tmux/themes/tebby24_theme.conf

set -s extended-keys on
set -as terminal-features 'alacritty:extkeys'
set -s extended-keys-format csi-u

